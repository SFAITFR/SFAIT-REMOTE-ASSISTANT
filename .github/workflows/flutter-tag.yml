name: Flutter Tag Build

# SFAIT: manual runs only (Actions tab). Releases are built locally and published by hand;
# automatic tag runs re-marked releases as pre-releases and added unwanted assets.
on:
  workflow_dispatch:

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
